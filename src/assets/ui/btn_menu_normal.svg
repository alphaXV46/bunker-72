  <path d="M400 55 H0 V53 H398 V2 H400 Z" fill="#07090c" />
  
  <!-- Inner Plate Frame -->
  <rect x="4" y="4" width="392" height="47" fill="#151921" stroke="#2b3441" stroke-width="1" />
  
  <!-- Clean Center Surface -->
