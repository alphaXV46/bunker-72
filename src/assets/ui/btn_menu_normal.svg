  <rect x="8" y="8" width="1" height="1" fill="#58677c" />
  <!-- TR -->
  <rect x="389" y="8" width="3" height="3" fill="#07090c" />
  <rect x="389" y="8" width="1" height="1" fill="#58677c" />
  <!-- BL -->
