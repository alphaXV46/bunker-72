  <rect x="8" y="44" width="1" height="1" fill="#58677c" />
  <!-- BR -->
  <rect x="389" y="44" width="3" height="3" fill="#07090c" />
  <rect x="389" y="44" width="1" height="1" fill="#58677c" />

  <!-- Clean Corner Accents -->
  <path d="M6 14 V6 H14" stroke="#3b4657" stroke-width="1" />
  <path d="M394 14 V6 H386" stroke="#3b4657" stroke-width="1" />
  <path d="M6 41 V49 H14" stroke="#3b4657" stroke-width="1" />
