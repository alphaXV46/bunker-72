  <!-- conversational warmth / subtle emphasis -->
  <g fill="#f4c66e" opacity=".9"><circle cx="472" cy="245" r="7"/><circle cx="498" cy="224" r="5"/><circle cx="767" cy="235" r="6"/><circle cx="790" cy="213" r="4"/></g>
  <path d="M470 280q40-35 80 0" fill="none" stroke="#efb95f" stroke-width="7" stroke-linecap="round" opacity=".8"/>
  <path d="M735 271q40-35 80 0" fill="none" stroke="#efb95f" stroke-width="7" stroke-linecap="round" opacity=".8"/>
</svg>
