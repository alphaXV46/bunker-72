  <g fill="#ad6e50" stroke="#814e43" stroke-width="5"><rect x="445" y="112" width="230" height="210" rx="8"/><rect x="690" y="112" width="230" height="210" rx="8"/><rect x="935" y="112" width="250" height="210" rx="8"/></g>
  <g fill="none" stroke="#f7d6a7" stroke-width="7"><path d="M560 120v190M805 120v190M1060 120v190"/></g>
  <rect x="515" y="362" width="270" height="78" rx="16" fill="#9dc4c0" stroke="#638b88" stroke-width="7"/>
  <path d="M575 362v78M725 362v78" stroke="#638b88" stroke-width="7"/>
  <circle cx="640" cy="400" r="19" fill="#f6d6a6" stroke="#638b88" stroke-width="6"/>
