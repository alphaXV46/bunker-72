  </g>
  <ellipse cx="640" cy="610" rx="540" ry="72" fill="#3d2930" opacity=".22" filter="url(#soft)"/>

  <!-- cabinets and window -->
  <rect x="55" y="82" width="1170" height="290" rx="18" fill="#dba875" filter="url(#shadow)"/>
  <rect x="89" y="112" width="310" height="190" rx="10" fill="#fef8ee" stroke="#bb7c59" stroke-width="8"/>
