  <path d="M365 565l-35 155M915 565l35 155" stroke="#78473f" stroke-width="24" stroke-linecap="round"/>
  <path d="M445 502q195 35 390 0" fill="none" stroke="#f3c084" stroke-width="7" opacity=".55"/>
