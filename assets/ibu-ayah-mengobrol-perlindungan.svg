<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#fff6e9"/><stop offset="1" stop-color="#f6dfc2"/></linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#bd805e"/><stop offset="1" stop-color="#8e5847"/></linearGradient>
    <linearGradient id="table" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#d99765"/><stop offset="1" stop-color="#a76049"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#573c3a" flood-opacity=".22"/></filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="18"/></filter>
  </defs>

  <!-- warm kitchen backdrop -->
  <rect width="1280" height="720" fill="url(#wall)"/>
  <rect y="520" width="1280" height="200" fill="url(#floor)"/>
